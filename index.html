<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Loadstring Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #2a2a32;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #00ffcc;
            color: #1e1e24;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #00ccaa;
        }
        .result-container {
            margin-top: 20px;
        }
        .result-box {
            background-color: #2a2a32;
            border: 1px solid #444;
            padding: 15px;
            font-family: monospace;
            word-break: break-all;
            white-space: pre-wrap;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>Генератор Loadstring для Roblox</h2>
    <p>Вставьте ваш Lua-скрипт ниже, чтобы получить готовую строку для выполнения в игре:</p>
    
    <textarea id="sourceCode" placeholder="print('Hello World!')"></textarea>
    <button onclick="generateLoadstring()">Создать ссылку</button>

    <div class="result-container">
        <h3>Готовый результат:</h3>
        <div id="output" class="result-box">Здесь появится ваш loadstring...</div>
    </div>

    <script>
        function generateLoadstring() {
            const code = document.getElementById('sourceCode').value;
            if (!code.trim()) {
                document.getElementById('output').innerText = 'Пожалуйста, введите код скрипта.';
                return;
            }

            try {
                const utf8Bytes = new TextEncoder().encode(code);
                let binary = '';
                for (let i = 0; i < utf8Bytes.length; i++) {
                    binary += String.fromCharCode(utf8Bytes[i]);
                }
                const base64Code = btoa(binary);

                const currentUrl = window.location.href.split('?')[0].split('#')[0];
                const rawUrl = currentUrl + '?script=' + encodeURIComponent(base64Code);

                const luaLoadstring = `loadstring(game:HttpGet("${rawUrl}"))()`;
                
                document.getElementById('output').innerText = luaLoadstring;
            } catch (e) {
                document.getElementById('output').innerText = 'Ошибка при генерации: ' + e.message;
            }
        }

        function checkQueryParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const base64Script = urlParams.get('script');
            
            if (base64Script) {
                try {
                    const binaryString = atob(base64Script);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const decodedCode = new TextDecoder().decode(bytes);

                    document.body.innerHTML = '';
                    document.body.style.margin = '0';
                    document.body.style.padding = '0';
                    document.body.style.background = '#fff';
                    document.body.style.color = '#000';
                    
                    const pre = document.createElement('pre');
                    pre.style.whiteSpace = 'pre-wrap';
                    pre.style.wordBreak = 'break-all';
                    pre.innerText = decodedCode;
                    document.body.appendChild(pre);
                } catch (e) {
                    document.body.innerText = 'Ошибка декодирования скрипта.';
                }
            }
        }

        window.onload = checkQueryParam;
    </script>
</body>
</html>
