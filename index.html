<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Loadstring Pastebin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2a2a32;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #00ffcc;
            color: #1e1e24;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #00ccaa;
        }
        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        .result-container {
            margin-top: 20px;
            display: none;
        }
        .result-box {
            background-color: #2a2a32;
            border: 1px solid #444;
            padding: 15px;
            font-family: monospace;
            word-break: break-all;
            white-space: pre-wrap;
            margin-top: 5px;
            color: #00ffcc;
        }
        .config-section {
            background-color: #25252d;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .config-section input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px 0;
            background: #1e1e24;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }
        .alias-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #2a2a32;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Roblox Loadstring Pastebin v3</h2>

    <div class="config-section">
        <h3>Настройки GitHub API</h3>
        <label>GitHub Personal Access Token:</label>
        <input type="text" id="githubToken" placeholder="github_pat_...">
        
        <label>Ваш GitHub логин (Owner):</label>
        <input type="text" id="githubUser" value="MrDani307">
        
        <label>Имя репозитория (Repository):</label>
        <input type="text" id="githubRepo" value="URL-for-loadstrings">
    </div>
    
    <input type="text" id="scriptAlias" class="alias-input" placeholder="Красивое название ссылки (например: fly)">
    <br><br>

    <textarea id="sourceCode" placeholder="-- Вставьте ваш Lua код сюда&#10;print('Hello World!')"></textarea>
    <button id="submitBtn" onclick="uploadScript()">Опубликовать и получить красивую ссылку</button>

    <div id="resultContainer" class="result-container">
        <h3>Ваш красивый Loadstring:</h3>
        <div id="output" class="result-box"></div>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('gh_token')) document.getElementById('githubToken').value = localStorage.getItem('gh_token');
            if(localStorage.getItem('gh_user')) document.getElementById('githubUser').value = localStorage.getItem('gh_user');
            if(localStorage.getItem('gh_repo')) document.getElementById('githubRepo').value = localStorage.getItem('gh_repo');
        }

        async function uploadScript() {
            const token = document.getElementById('githubToken').value.trim();
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const code = document.getElementById('sourceCode').value;
            let alias = document.getElementById('scriptAlias').value.trim().toLowerCase();

            if (!token || !user || !repo || !code.trim()) {
                alert('Заполните все поля и введите код скрипта!');
                return;
            }

            if (!alias) {
                alias = Math.random().toString(36).substring(2, 7);
            }

            // Убираем лишние символы из названия ссылки
            alias = alias.replace(/[^a-z0-9-_]/g, '');

            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Создание красивой ссылки...';

            // Путь к файлу-перенаправлению в репозитории
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${alias}`;

            // Создаем HTML-файл для Jekyll, который отдаст чистый текст скрипта
            const redirectContent = `---
permalink: /${alias}
redirect_to: https://raw.githubusercontent.com/${user}/${repo}/main/scripts/${alias}.lua
---`;

            // Сначала создаем сам Lua скрипт
            const luaUrl = `https://api.github.com/repos/${user}/${repo}/contents/scripts/${alias}.lua`;
            
            const utf8Bytes = new TextEncoder().encode(code);
            let binary = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                binary += String.fromCharCode(utf8Bytes[i]);
            }
            const base64Lua = btoa(binary);

            try {
                // 1. Загружаем Lua скрипт
                await fetch(luaUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Create script ${alias}`,
                        content: base64Lua
                    })
                });

                // 2. Создаем красивый редирект для GitHub Pages
                const base64Redirect = btoa(redirectContent);
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Create redirect for ${alias}`,
                        content: base64Redirect
                    })
                });

                if (response.ok) {
                    // Формируем самый красивый URL через твой GitHub Pages домен
                    const customUrl = `https://${user}.github.io/${repo}/${alias}`;
                    const loadstringCode = `loadstring(game:HttpGet("${customUrl}"))()`;
                    
                    document.getElementById('output').innerText = loadstringCode;
                    document.getElementById('resultContainer').style.display = 'block';
                } else {
                    const errData = await response.json();
                    alert('Ошибка: ' + (errData.message || response.statusText));
                }
            } catch (error) {
                alert('Произошла ошибка: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Опубликовать и получить красивую ссылку';
            }
        }
    </script>
</body>
</html>
