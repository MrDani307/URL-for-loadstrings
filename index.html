<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Loadstring Pastebin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2a2a32;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #00ffcc;
            color: #1e1e24;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #00ccaa;
        }
        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        .toggle-config-btn {
            background-color: #3a3a44;
            color: #fff;
            padding: 8px 15px;
            font-size: 14px;
            width: auto;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .toggle-config-btn:hover {
            background-color: #4a4a55;
        }
        .result-container {
            margin-top: 20px;
            display: none;
        }
        .result-box-wrapper {
            position: relative;
            margin-top: 5px;
        }
        .result-box {
            background-color: #2a2a32;
            border: 1px solid #444;
            padding: 15px;
            padding-right: 100px;
            font-family: monospace;
            word-break: break-all;
            white-space: pre-wrap;
            color: #00ffcc;
        }
        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #3a3a44;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            margin-top: 0;
        }
        .copy-btn:hover {
            background-color: #4a4a55;
        }
        .config-section, .mode-section, .auth-section, .history-section {
            background-color: #25252d;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .config-section input, .auth-section input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px 0;
            background: #1e1e24;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }
        .alias-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #2a2a32;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }
        .mode-option {
            margin: 10px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .mode-option input {
            margin-right: 10px;
            cursor: pointer;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
        }
        .auth-tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #3a3a44;
            margin-right: 5px;
            border-radius: 4px 4px 0 0;
        }
        .auth-tab.active {
            background: #00ffcc;
            color: #1e1e24;
            font-weight: bold;
        }
        .history-item {
            background: #2a2a32;
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
        }
        .history-item-title {
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .history-item-url {
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            word-break: break-all;
            padding-right: 90px;
        }
        .history-copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #3a3a44;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .history-copy-btn:hover {
            background: #4a4a55;
        }
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .logout-btn {
            background: #ff5555;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin-top: 0;
        }
        .logout-btn:hover {
            background: #cc4444;
        }
    </style>
</head>
<body>

    <h2>Roblox Loadstring Pastebin v6</h2>

    <div class="auth-section">
        <div id="authForms">
            <div class="auth-tabs">
                <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Вход</div>
                <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">Регистрация</div>
            </div>
            
            <div id="loginForm">
                <label>Логин:</label>
                <input type="text" id="loginUser" placeholder="Введите логин">
                <label>Пароль:</label>
                <input type="password" id="loginPass" placeholder="Введите пароль">
                <button onclick="handleAuth('login')">Войти</button>
            </div>

            <div id="registerForm" style="display: none;">
                <label>Придумайте логин:</label>
                <input type="text" id="regUser" placeholder="Минимум 3 символа">
                <label>Придумайте пароль:</label>
                <input type="password" id="regPass" placeholder="Минимум 4 символа">
                <button onclick="handleAuth('register')">Зарегистрироваться</button>
            </div>
        </div>

        <div id="userInfoSection" style="display: none;">
            <div class="user-info">
                <span>Вы вошли как: <strong id="currentUserName" style="color: #00ffcc;"></strong></span>
                <button class="logout-btn" onclick="handleLogout()">Выйти</button>
            </div>
        </div>
    </div>

    <button class="toggle-config-btn" onclick="toggleConfig()">Скрыть / Показать настройки</button>

    <div id="configSection" class="config-section">
        <h3>Настройки GitHub API</h3>
        <label>GitHub Personal Access Token:</label>
        <input type="text" id="githubToken" placeholder="github_pat_...">
        
        <label>Ваш GitHub логин (Owner):</label>
        <input type="text" id="githubUser" value="MrDani307">
        
        <label>Имя репозитория (Repository):</label>
        <input type="text" id="githubRepo" value="URL-for-loadstrings">
    </div>

    <div class="mode-section">
        <h3>Режим генерации ссылки</h3>
        <label class="mode-option">
            <input type="radio" name="urlMode" value="pages" checked onchange="updateInputs()">
            Красивая ссылка через GitHub Pages (в папку pages/)
        </label>
        <label class="mode-option">
            <input type="radio" name="urlMode" value="short" onchange="updateInputs()">
            Сокращенная ссылка (через TinyURL)
        </label>
    </div>
    
    <input type="text" id="scriptAlias" class="alias-input" placeholder="Название ссылки (например: fly)">
    <br><br>

    <textarea id="sourceCode" placeholder="-- Вставьте ваш Lua код сюда&#10;print('Hello World!')"></textarea>
    <button id="submitBtn" onclick="uploadScript()">Опубликовать и получить ссылку</button>

    <div id="resultContainer" class="result-container">
        <h3>Ваш Loadstring:</h3>
        <div class="result-box-wrapper">
            <div id="output" class="result-box"></div>
            <button class="copy-btn" onclick="copyToClipboard('output')">Копировать</button>
        </div>
    </div>

    <div id="historySection" class="history-section" style="display: none;">
        <h3>История скриптов аккаунта</h3>
        <div id="historyList">Нет сохраненных скриптов.</div>
    </div>

    <script>
        let currentUser = null;

        window.onload = function() {
            if(localStorage.getItem('gh_token')) document.getElementById('githubToken').value = localStorage.getItem('gh_token');
            if(localStorage.getItem('gh_user')) document.getElementById('githubUser').value = localStorage.getItem('gh_user');
            if(localStorage.getItem('gh_repo')) document.getElementById('githubRepo').value = localStorage.getItem('gh_repo');
            if(localStorage.getItem('gh_config_visible') === 'false') {
                document.getElementById('configSection').style.display = 'none';
            }
            
            const sessionUser = sessionStorage.getItem('current_user');
            if (sessionUser) {
                initUserSession(sessionUser);
            }
            
            updateInputs();
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            }
        }

        function handleAuth(type) {
            const users = JSON.parse(localStorage.getItem('app_users') || '{}');
            
            if (type === 'register') {
                const user = document.getElementById('regUser').value.trim();
                const pass = document.getElementById('regPass').value;
                
                if (user.length < 3 || pass.length < 4) {
                    alert('Логин должен быть от 3 символов, пароль от 4 символов!');
                    return;
                }
                if (users[user]) {
                    alert('Пользователь с таким логином уже существует!');
                    return;
                }
                
                users[user] = { password: pass, history: [] };
                localStorage.setItem('app_users', JSON.stringify(users));
                alert('Регистрация успешна! Теперь вы можете войти.');
                switchAuthTab('login');
            } else {
                const user = document.getElementById('loginUser').value.trim();
                const pass = document.getElementById('loginPass').value;
                
                if (!users[user] || users[user].password !== pass) {
                    alert('Неверный логин или пароль!');
                    return;
                }
                
                sessionStorage.setItem('current_user', user);
                initUserSession(user);
            }
        }

        function initUserSession(user) {
            currentUser = user;
            document.getElementById('authForms').style.display = 'none';
            document.getElementById('userInfoSection').style.display = 'block';
            document.getElementById('currentUserName').innerText = user;
            document.getElementById('historySection').style.display = 'block';
            renderHistory();
        }

        function handleLogout() {
            currentUser = null;
            sessionStorage.removeItem('current_user');
            document.getElementById('authForms').style.display = 'block';
            document.getElementById('userInfoSection').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
        }

        function saveToUserHistory(title, loadstring) {
            if (!currentUser) return;
            const users = JSON.parse(localStorage.getItem('app_users') || '{}');
            if (users[currentUser]) {
                users[currentUser].history.push({ title, loadstring });
                localStorage.setItem('app_users', JSON.stringify(users));
                renderHistory();
            }
        }

        function renderHistory() {
            if (!currentUser) return;
            const users = JSON.parse(localStorage.getItem('app_users') || '{}');
            const historyList = document.getElementById('historyList');
            const history = users[currentUser]?.history || [];
            
            if (history.length === 0) {
                historyList.innerHTML = 'Нет сохраненных скриптов.';
                return;
            }
            
            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <div class="history-item-title">${item.title}</div>
                    <div class="history-item-url" id="histUrl_${index}">${item.loadstring}</div>
                    <button class="history-copy-btn" onclick="copyToClipboard('histUrl_${index}')">Копировать</button>
                </div>
            `).reverse().join('');
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Лоадстринг успешно скопирован в буфер обмена!');
            }).catch(err => {
                alert('Не удалось скопировать текст: ', err);
            });
        }

        function toggleConfig() {
            const config = document.getElementById('configSection');
            if (config.style.display === 'none') {
                config.style.display = 'block';
                localStorage.setItem('gh_config_visible', 'true');
            } else {
                config.style.display = 'none';
                localStorage.setItem('gh_config_visible', 'false');
            }
        }

        function updateInputs() {
            const mode = document.querySelector('input[name="urlMode"]:checked').value;
            const aliasInput = document.getElementById('scriptAlias');
            if (mode === 'short') {
                aliasInput.placeholder = 'Название файла на GitHub (необязательно)';
            } else {
                aliasInput.placeholder = 'Название ссылки (например: fly)';
            }
        }

        async function shortenUrl(longUrl) {
            try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (response.ok) {
                    return await response.text();
                }
            } catch (e) {
                console.error("Не удалось сократить ссылку:", e);
            }
            return longUrl;
        }

        async function uploadScript() {
            const token = document.getElementById('githubToken').value.trim();
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const code = document.getElementById('sourceCode').value;
            const mode = document.querySelector('input[name="urlMode"]:checked').value;
            let alias = document.getElementById('scriptAlias').value.trim().toLowerCase();

            if (!token || !user || !repo || !code.trim()) {
                alert('Заполните все поля и введите код скрипта!');
                return;
            }

            if (!alias) {
                alias = Math.random().toString(36).substring(2, 8);
            }

            alias = alias.replace(/[^a-z0-9-_]/g, '');

            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Публикация скрипта...';

            let path, fileName;
            if (mode === 'pages') {
                fileName = `${alias}.txt`;
                path = `pages/${fileName}`;
            } else {
                fileName = `${alias}.lua`;
                path = `scripts/${fileName}`;
            }

            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;

            const utf8Bytes = new TextEncoder().encode(code);
            let binary = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                binary += String.fromCharCode(utf8Bytes[i]);
            }
            const base64Content = btoa(binary);

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload script ${fileName}`,
                        content: base64Content
                    })
                });

                if (response.ok) {
                    let targetUrl;
                    if (mode === 'pages') {
                        targetUrl = `https://${user}.github.io/${repo}/pages/${fileName}`;
                    } else {
                        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/scripts/${fileName}`;
                        targetUrl = await shortenUrl(rawUrl);
                    }

                    const loadstringCode = `loadstring(game:HttpGet("${targetUrl}"))()`;
                    document.getElementById('output').innerText = loadstringCode;
                    document.getElementById('resultContainer').style.display = 'block';
                    
                    if (currentUser) {
                        saveToUserHistory(fileName, loadstringCode);
                    }
                } else {
                    const errData = await response.json();
                    alert('Ошибка: ' + (errData.message || response.statusText));
                }
            } catch (error) {
                alert('Произошла ошибка: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Опубликовать и получить ссылку';
            }
        }
    </script>
</body>
</html>
